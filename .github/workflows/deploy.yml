name: Deploy to Simply.com

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Deploy theme via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ftp.simply.com
          username: vegama.dk
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: wp-content/themes/vegama/
          server-dir: /public_html/wp-content/themes/vegama/
          protocol: ftps
          port: 21
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .DS_Store

      - name: Deploy .htaccess via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ftp.simply.com
          username: vegama.dk
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: /public_html/
          protocol: ftps
          port: 21
          include: |
            .htaccess
          exclude: |
            **
            !.htaccess
